services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: studio
      MINIO_ROOT_PASSWORD: studio-password
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://studio:studio@postgres:5432/studio?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4010
    ports: ["4010:4010"]
    depends_on: [postgres, redis]
  worker:
    build:
      context: .
      dockerfile: infra/worker.Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: [redis]
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4010
    ports: ["3010:3010"]
    depends_on: [api]
volumes:
  postgres_data:
  minio_data:
