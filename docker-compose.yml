# The API and the worker must agree on where bytes live, exactly as they must agree on
# STUDIO_ARTIFACTS_DIR, so both merge this one anchor instead of listing it twice.
# Defaults keep today's behaviour: disk. Setting STORAGE_BACKEND=s3 flips both processes.
# The S3 key defaults are dev-only and match the MinIO root credentials below; a real
# deployment overrides every one of them.
x-storage-env: &storage-env
  STORAGE_BACKEND: ${STORAGE_BACKEND:-disk}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-studio}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-studio}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-studio-password}

services:
  postgres:
    # Match the embedded-postgres 18.x the test suites run on, so dev and test
    # share one major version.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
    ports: ["5433:5432"]
    # postgres:18+ wants the mount at the parent dir and keeps version-specific
    # subdirs inside (docker-library/postgres#1259); legacy .../data mounts abort.
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    # AOF on + a named volume: a container restart must not drop queued jobs —
    # losing them means generation tasks the DB says exist but nothing will ever
    # pick up again.
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  # Only used when STORAGE_BACKEND=s3, which is why it sits behind the s3 profile:
  # the default disk backend never talks to it, and a plain `up` should not make
  # anyone download 227 MB they cannot use. Nothing here creates the `studio`
  # bucket, so an s3 run needs `mc mb local/studio` first. api and worker
  # deliberately do not gate on this service's health: on the default disk
  # backend they never talk to it, and a dependency would refuse to start them
  # for a service they are not using.
  minio:
    profiles: ["s3"]
    # MinIO left Docker Hub in 2025; quay.io is the official registry now.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: studio
      MINIO_ROOT_PASSWORD: studio-password
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
  # ── 应用栈（profile: full）──
  # `docker compose up -d` 仍只起基础设施（本机开发树自己跑 pnpm dev）；
  # `docker compose --profile full up -d` 一条命令起整套：应用镜像从 ghcr
  # 拉取（`VERSION` 不设即 latest），迁移内置在 api 的启动命令里，起来
  # 即用——用户侧不执行任何 build。本仓库的开发者要本地构建时，叠加
  # compose.dev.yml（build: 块收在那里）。web 的 /api 代理在构建期指向
  # 服务名 api。
  api:
    profiles: ["full"]
    image: ghcr.io/dreamofxm/makemovie/api:${VERSION:-latest}
    environment:
      DATABASE_URL: postgresql://studio:studio@postgres:5432/studio?schema=public
      REDIS_URL: redis://redis:6379
      # 留空即由容器首启生成并写进 secrets 卷——api 与 worker 挂的是同一个卷，
      # 所以两边自动拿到同一把。显式给了就用给的。production 拒绝全零 key，
      # 这就是这里不能像别处那样放一个 `:-<默认值>` 的原因。
      STUDIO_MASTER_KEY: ${STUDIO_MASTER_KEY:-}
      STUDIO_ARTIFACTS_DIR: /var/lib/studio/artifacts
      STUDIO_SECRETS_DIR: /var/lib/studio/secrets
      <<: *storage-env
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3010}
      PORT: 4010
    ports: ["4010:4010"]
    volumes: ["artifacts:/var/lib/studio/artifacts", "secrets:/var/lib/studio/secrets"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    profiles: ["full"]
    image: ghcr.io/dreamofxm/makemovie/worker:${VERSION:-latest}
    environment:
      DATABASE_URL: postgresql://studio:studio@postgres:5432/studio?schema=public
      REDIS_URL: redis://redis:6379
      # 与 api 同一处引导、同一个卷（见上方 api 的说明）。
      STUDIO_MASTER_KEY: ${STUDIO_MASTER_KEY:-}
      STUDIO_ARTIFACTS_DIR: /var/lib/studio/artifacts
      STUDIO_SECRETS_DIR: /var/lib/studio/secrets
      <<: *storage-env
      STUDIO_QC_MODE: ${STUDIO_QC_MODE:-random}
      # 字幕交付方式（auto|burn|soft）。.env.example 里记着它，这里也得接着，
      # 否则在 .env 里改了没有效果。
      STUDIO_SUBTITLE_MODE: ${STUDIO_SUBTITLE_MODE:-auto}
    volumes: ["artifacts:/var/lib/studio/artifacts", "secrets:/var/lib/studio/secrets"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
  web:
    profiles: ["full"]
    image: ghcr.io/dreamofxm/makemovie/web:${VERSION:-latest}
    ports: ["3010:3010"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
  minio_data:
  artifacts:
  # 单独一个卷而不是塞进 artifacts：artifacts 是生成物，运营会为了腾空间整个删掉，
  # 而 master key 一丢，库里所有 provider 凭据都解不开。生命周期不能绑在一起。
  secrets:
