# Publish the three app images (amd64 + arm64) to ghcr.io on version tags.
# A stranger's install then needs no local build — the Release attaches
# docker-compose.yml and example.env, so the whole install is:
#   wget ×2 → docker compose --profile full up -d
# Images: ghcr.io/<owner>/makemovie/{api,worker,web}:{version,latest}
name: docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # The planned allinone (single-container) image must land at
          # ghcr.io/dreamofxm/makemovie — no /app suffix, it is the storefront.
          # Appending matrix.app would yield .../makemovie/allinone, which none
          # of the docs reference; special-case the image when that lands.
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          # vX.Y.Z must land as bare semver (0.2.0, 0.2): README, compose's VERSION=
          # and the release notes all pin the v-less form, while type=ref keeps the
          # prefix — that mismatch 404'd the documented install line. Dashed
          # prerelease tags never refresh latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.app }}.Dockerfile
          # Native arm64 matters: Apple Silicon hosts otherwise run the amd64 image
          # under Rosetta, and ffmpeg video composition is exactly the workload
          # where that tax hurts. Both platforms must come out of every tag.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
