# Publish the terminal manual and the two agent skills to npm on version tags.
# A stranger then reads the whole project without cloning, or installs the
# skills into an agent's skills directory:
#   npx -y makemovie@latest
#   npx -y makemovie@latest install-skill
#
# Authentication is OIDC only — there is no npm token anywhere in this repository.
# One-time setup, once the package exists on npm (npmjs.com -> the package ->
# Settings -> Trusted Publisher -> GitHub Actions):
#   Organization or user: DreamOfXM
#   Repository:           makemovie
#   Workflow filename:    npm.yml
#   Environment name:     (leave empty)
#   Allowed actions:      npm publish        <-- pick this one, not stage-only
# After that binding exists, a tag is the whole release: images to ghcr via
# docker.yml, package to npm here.
name: npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC, for both trusted publishing and the provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing landed in npm CLI 11.5.1, which is newer than the npm
      # bundled with Node 22 — without this the publish falls back to looking for
      # a token, finds none, and fails with a 401 that says nothing about OIDC.
      # Pinned to the 11.x major on purpose: npm 12 is out as `latest` and turns
      # install-time behavior stricter (lifecycle scripts, git and remote-URL
      # dependencies all become opt-in), which is not a variable worth taking on
      # inside the release path.
      - name: Ensure npm CLI supports trusted publishing
        run: |
          npm install -g npm@^11
          npm --version

      # package.json is the source of truth for the version, so a tag and the
      # manifest can only disagree by mistake — and that mistake would hand
      # `npx makemovie@latest` a manual from a different commit than the Release.
      - name: Tag must match package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME != package.json version $pkg"
            exit 1
          fi

      # Re-running a failed tag build must not fail on "version already exists".
      - name: Is this version already on npm?
        id: probe
        run: |
          if npm view "makemovie@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "已发布过，跳过。"
          fi

      - name: Pack guard
        if: steps.probe.outputs.published != 'true'
        run: node scripts/pack-check.mjs

      - name: Publish
        if: steps.probe.outputs.published != 'true'
        run: |
          set -o pipefail
          if npm publish --provenance 2>&1 | tee /tmp/npm-publish.log; then
            exit 0
          fi
          echo "::error::发布失败。若本仓库还不是该包的 Trusted Publisher，先在 npmjs.com 的包设置里加上它（字段见本文件开头）；包在 npm 上还不存在时无法配置，那种情况先手动发一次。"
          exit 1
